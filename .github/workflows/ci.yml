name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check app tests migrations
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Show test failures on the run summary
        if: failure()
        working-directory: .
        run: python .github/annotate_pytest.py backend/pytest.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit

  docker:
    # Builds the same image Railway deploys, so a broken Dockerfile is caught before it reaches production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t supermarketman-backend backend
      - name: Image starts and imports the app
        run: docker run --rm --entrypoint python supermarketman-backend -c "import app.main, app.worker; print('ok')"
      - run: docker build --build-arg VITE_API_URL=https://api.example.com -t supermarketman-web web
      - name: Web server config is valid
        run: docker run --rm supermarketman-web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
