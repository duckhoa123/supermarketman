# Local development: Postgres + API + worker.
#   cp .env.example .env
#   docker compose up --build
#   docker compose exec api python -m app.seed --email owner@example.com
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://restaurant:restaurant@db:5432/restaurant
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes: [./backend:/srv]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://restaurant:restaurant@db:5432/restaurant
    command: python -m app.worker --schedule
    volumes: [./backend:/srv]
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
